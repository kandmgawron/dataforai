AWSTemplateFormatVersion: "2010-09-09"
Description: "Meridian Outdoor Co. — Vector store extension (OpenSearch Serverless + pgvector indexes)"

Parameters:
  ProjectName:
    Type: String
    Default: meridian
  Environment:
    Type: String
    Default: dev
  NotebookRoleArn:
    Type: String
    Description: ARN of the Notebook IAM role (from meridian-base stack)
  LambdaExecutionRoleArn:
    Type: String
    Description: ARN of the Lambda execution IAM role (from meridian-base stack)

Resources:

  # ---------------------------------------------------------------------------
  # AOSS Prerequisites — service-linked role created once per account/region
  # The CF user (ridge-course-dev) lacks iam:CreateServiceLinkedRole, so a
  # Lambda with its own role handles this one-time setup.
  # ---------------------------------------------------------------------------

  AossSetupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-aoss-setup-role-${Environment}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AossSetupPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: logs:*
                Resource: '*'
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: 'arn:aws:iam::*:role/aws-service-role/observability.aoss.amazonaws.com/*'

  AossSetupFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-aoss-setup-${Environment}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt AossSetupRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, json, urllib.request
          def respond(event, context, status, data={}, pid=None):
            body = json.dumps({
              'Status': status, 'Reason': 'See CloudWatch',
              'PhysicalResourceId': pid or context.log_stream_name,
              'StackId': event['StackId'], 'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'], 'Data': data
            }).encode()
            req = urllib.request.Request(event['ResponseURL'], data=body, headers={'Content-Type': ''}, method='PUT')
            urllib.request.urlopen(req)
          def handler(event, context):
            try:
              if event['RequestType'] == 'Create':
                iam = boto3.client('iam')
                try:
                  iam.create_service_linked_role(AWSServiceName='observability.aoss.amazonaws.com')
                except iam.exceptions.InvalidInputException:
                  pass  # role already exists
              respond(event, context, 'SUCCESS', {}, 'aoss-slr')
            except Exception as e:
              respond(event, context, 'FAILED', {'Error': str(e)})

  AossSetup:
    Type: Custom::AossSetup
    Properties:
      ServiceToken: !GetAtt AossSetupFunction.Arn

  # ---------------------------------------------------------------------------
  # OpenSearch Serverless — Encryption Security Policy
  # ---------------------------------------------------------------------------
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-products-${Environment}"
      Type: encryption
      Policy: !Sub |
        {
          "Rules": [
            {
              "ResourceType": "collection",
              "Resource": ["collection/meridian-products-${Environment}"]
            }
          ],
          "AWSOwnedKey": true
        }

  # ---------------------------------------------------------------------------
  # OpenSearch Serverless — Network Security Policy
  # ---------------------------------------------------------------------------
  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-products-net-${Environment}"
      Type: network
      Policy: !Sub |
        [
          {
            "Rules": [
              {
                "ResourceType": "collection",
                "Resource": ["collection/meridian-products-${Environment}"]
              },
              {
                "ResourceType": "dashboard",
                "Resource": ["collection/meridian-products-${Environment}"]
              }
            ],
            "AllowFromPublic": true
          }
        ]

  # ---------------------------------------------------------------------------
  # OpenSearch Serverless — Collection
  # ---------------------------------------------------------------------------
  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn:
      - OpenSearchEncryptionPolicy
      - OpenSearchNetworkPolicy
      - AossSetup
    Properties:
      Name: !Sub "meridian-products-${Environment}"
      Type: VECTORSEARCH
      Description: !Sub "Meridian product catalog vector store (${Environment})"

  # ---------------------------------------------------------------------------
  # OpenSearch Serverless — Data Access Policy
  # ---------------------------------------------------------------------------
  OpenSearchAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    DependsOn: OpenSearchCollection
    Properties:
      Name: !Sub "${ProjectName}-products-${Environment}"
      Type: data
      Policy: !Sub
        - |
          [
            {
              "Rules": [
                {
                  "ResourceType": "index",
                  "Resource": ["index/meridian-products-${Environment}/*"],
                  "Permission": [
                    "aoss:CreateIndex",
                    "aoss:DeleteIndex",
                    "aoss:UpdateIndex",
                    "aoss:DescribeIndex",
                    "aoss:ReadDocument",
                    "aoss:WriteDocument"
                  ]
                },
                {
                  "ResourceType": "collection",
                  "Resource": ["collection/meridian-products-${Environment}"],
                  "Permission": [
                    "aoss:CreateCollectionItems",
                    "aoss:DeleteCollectionItems",
                    "aoss:UpdateCollectionItems",
                    "aoss:DescribeCollectionItems"
                  ]
                }
              ],
              "Principal": [
                "${NotebookRoleArn}",
                "${LambdaRoleArn}",
                "arn:aws:iam::${AWS::AccountId}:root"
              ]
            }
          ]
        - NotebookRoleArn: !Ref NotebookRoleArn
          LambdaRoleArn: !Ref LambdaExecutionRoleArn

  # ---------------------------------------------------------------------------
  # CloudWatch Log Group
  # ---------------------------------------------------------------------------
  IndexingLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /meridian/opensearch/indexing
      RetentionInDays: 14

Outputs:

  OpenSearchCollectionEndpoint:
    Description: OpenSearch Serverless collection endpoint
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
    Export:
      Name: !Sub "${ProjectName}-OpenSearchCollectionEndpoint-${Environment}"

  OpenSearchCollectionArn:
    Description: OpenSearch Serverless collection ARN
    Value: !GetAtt OpenSearchCollection.Arn
    Export:
      Name: !Sub "${ProjectName}-OpenSearchCollectionArn-${Environment}"

  OpenSearchCollectionId:
    Description: OpenSearch Serverless collection ID
    Value: !GetAtt OpenSearchCollection.Id
    Export:
      Name: !Sub "${ProjectName}-OpenSearchCollectionId-${Environment}"
